    <script>
      // Gracefully handle benign HMR WebSocket connection errors in sandbox iframe
      window.addEventListener(
        'error',
        function (event) {
          if (
            (event.filename && event.filename.includes('@vite/client')) ||
            (event.message && (event.message.includes('WebSocket') || event.message.includes('vite-hmr')))
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        },
        true
      );
      window.addEventListener(
        'unhandledrejection',
        function (event) {
          const reason = String(event.reason || '');
          if (reason.includes('WebSocket') || reason.includes('@vite/client')) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        },
        true
      );
    </script>
  </head>
  <body class="bg-[#F5F3ED] text-[#222522] antialiased selection:bg-[#26352D] selection:text-[#F5F3ED]">

  </body>
